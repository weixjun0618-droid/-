const B = document.getElementById("brand");
const M = document.getElementById("model");
const Y = document.getElementById("year");
const G = document.getElementById("go");
const R = document.getElementById("result");
const C = document.getElementById("cards");
const COND = document.getElementById("cond");

function uniq(a) { return [...new Set(a.filter(Boolean))]; }
function opts(el, placeholder, arr, disabled) {
  el.innerHTML = "";
  el.add(new Option(placeholder, ""));
  uniq(arr).forEach(v => el.add(new Option(v, v)));
  el.disabled = !!disabled;
}
function clearResult() { R.style.display = "none"; C.innerHTML = ""; }

B.addEventListener("change", function() {
  clearResult(); G.disabled = true;
  opts(M, "請選擇車型", D.filter(x=>x.brand===B.value).map(x=>x.model), !B.value);
  opts(Y, "請先選擇車型", [], true);
});

M.addEventListener("change", function() {
  clearResult(); G.disabled = true;
  opts(Y, "請選擇年份", D.filter(x=>x.brand===B.value && x.model===M.value).map(x=>x.year), !M.value);
});

Y.addEventListener("change", function() {
  clearResult(); G.disabled = !Y.value;
});

G.addEventListener("click", function() {
  const found = D.filter(x=>x.brand===B.value && x.model===M.value && x.year===Y.value);
  COND.textContent = B.value + "  ›  " + M.value + "  ›  " + Y.value;
  C.innerHTML = "";
  found.forEach(x => {
    if(x.normal) C.innerHTML += '<div class="card"><div class="k">一般系列型號</div><div class="v">'+esc(x.normal)+'</div>'+(x.normal_barcode?'<div class="k" style="margin-top:10px">國際條碼</div><div class="bc">'+esc(x.normal_barcode)+'</div>':'')+'</div>';
    if(x.carbon) C.innerHTML += '<div class="card"><div class="k">活性碳系列型號</div><div class="v">'+esc(x.carbon)+'</div>'+(x.carbon_barcode?'<div class="k" style="margin-top:10px">國際條碼</div><div class="bc">'+esc(x.carbon_barcode)+'</div>':'')+'</div>';
  });
  if(!C.innerHTML) C.innerHTML='<div class="card">查無對應濾網資料。</div>';
  R.style.display="block";
  R.scrollIntoView({behavior:"smooth",block:"start"});
});
function esc(s) { return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
</script>
