document.getElementById('go').onclick=()=>{if(!b.value||!s.value||!m.value){r.className='result show';r.innerHTML='<div class="empty">請依序完成「車廠 → 車系 → 車型／代號」後再查詢。</div>';return}const a=D.filter(x=>x.brand===b.value&&x.series===s.value&&x.model===m.value);r.className='result show';r.innerHTML='<div class="result-head"><h2>適用 LB 濾網</h2><div class="condition">'+esc(b.value)+'｜'+esc(s.value)+'｜'+esc(m.value)+'</div></div><div class="items">'+a.map(x=>'<div class="item"><div class="item-top"><div><div class="vehicle">'+esc(x.model)+'</div><div class="series">'+esc(x.series)+'｜型錄第 '+esc(x.page)+' 頁</div></div><div class="badge">LB FILTER</div></div><div class="grid"><div class="box"><div class="k">上市日期</div><div class="v">'+esc(x.years||'—')+'</div></div><div class="box filter"><div class="k">LB 濾網型號</div><div class="v">'+esc(x.filter||'型錄未可靠辨識')+'</div></div></div></div>').join('')+'</div>'};
</script></body></html>
